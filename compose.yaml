name: kube-pilot-app
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: kube_autopilot
      POSTGRES_USER: kube_autopilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kube_autopilot -d kube_autopilot"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
